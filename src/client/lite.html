<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Agent Office</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The 2D view (lite.ts): the office without the 3D, for a phone or a computer the 3D is too much for. -->
    <header class="lite-bar">
      <label class="lite-floor" title="Bulunduğun kat: çalışanlarını görmek için başka bir kat seç">
        <span class="lite-floor-label">Kat</span>
        <select id="floor" aria-label="Kat"></select>
      </label>
      <a id="to-3d" class="btn" href="/?3d=1" title="Gezebildiğin 3D ofis">🏢 3D</a>
    </header>
    <main class="lite-main">
      <p id="floor-meta" class="lite-meta"></p>
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <h2 class="lite-h">Çalışanlar <span id="waiting-now" class="lite-waiting"></span></h2>
      <ul id="workers" class="lite-workers"></ul>
    </main>
    <nav class="lite-nav" aria-label="Ofis">
      <button id="btn-issues" class="btn" type="button">📌 Issue'lar <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button">🔀 PRs <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button">📋 Kuyruk <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button">✨ Yeni görev</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Yeniden bağlanılıyor…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
