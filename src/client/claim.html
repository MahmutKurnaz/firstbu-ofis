<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Office · Şifren</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="card">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><rect x="6" y="30" width="52" height="8" rx="3" fill="#e0a96d"/><rect x="18" y="14" width="28" height="18" rx="3" fill="#2b2d42"/><rect x="21" y="17" width="22" height="12" rx="1" fill="#7cf29a"/><circle cx="32" cy="50" r="9" fill="#ff8a5b"/><circle cx="29" cy="48" r="1.8" fill="#222"/><circle cx="35" cy="48" r="1.8" fill="#222"/></svg>
      </div>
      <h1 id="title">Ofisin hazır 🎉</h1>
      <p class="sub" id="sub">Kilit açılıyor…</p>
      <section id="reveal" hidden>
        <p class="warn"><strong>Bu şifreyi şimdi bir yere yaz.</strong> Yalnızca bir kez gösteriliyor: ofis sadece özetini (hash) tutar, bir daha gösteremez. Davet ettiğin takım arkadaşlarınla paylaş.</p>
        <div class="secret"><code id="pw"></code><button type="button" id="copy" class="mini">Kopyala</button></div>
        <label class="check"><input type="checkbox" id="saved" /> Güvenli bir yere kaydettim</label>
        <button type="button" id="enter" disabled>Ofise gir</button>
      </section>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Girişe git →</a>
    </main>
    <script type="module" src="./claim.ts"></script>
  </body>
</html>
